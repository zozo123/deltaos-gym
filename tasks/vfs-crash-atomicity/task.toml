schema_version = "1.4"
artifacts = ["/workspace/publisher.c"]

[task]
name = "deltaos/vfs-crash-atomicity"
version = "1.0.0"
description = "Make an atomic file publish survive crashes, short writes, interrupted writes and I/O errors, model-checked over every fault schedule."
keywords = ["linux", "vfs", "fsync", "crash-consistency", "model-checking"]

[metadata]
difficulty = "medium"
category = "systems"
tags = ["vfs", "storage", "crash-consistency", "model-checking"]

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
cpus = 2
memory_mb = 2048
storage_mb = 2048

[agent]
timeout_sec = 3600.0

[environment]
network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 2048
workdir = "/workspace"
