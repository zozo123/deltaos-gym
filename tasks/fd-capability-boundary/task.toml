schema_version = "1.4"
artifacts = ["/workspace/spawn.c"]

[task]
name = "deltaos/fd-capability-boundary"
version = "1.0.0"
description = "Pass exactly one descriptor across a real Linux fork/exec boundary and nothing else, observed from outside the launcher."
keywords = ["linux", "fork", "exec", "file-descriptors", "sandbox", "capabilities"]

[metadata]
difficulty = "medium"
category = "systems"
tags = ["fd-tables", "cloexec", "python", "c", "os-internals"]

[verifier]
timeout_sec = 400.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
cpus = 2
memory_mb = 2048
storage_mb = 1024

[agent]
timeout_sec = 2700.0

[environment]
network_mode = "no-network"
cpus = 2
memory_mb = 2048
storage_mb = 1024
workdir = "/workspace"
