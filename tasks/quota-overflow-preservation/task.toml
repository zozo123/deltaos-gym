schema_version = "1.4"
artifacts = ["/workspace/quota.c"]

[task]
name = "deltaos/quota-overflow-preservation"
version = "1.0.0"
description = "Repair eBPF-compatible 64-bit accounting with no wraparound and no partial state change."
keywords = ["linux", "ebpf", "xdp", "verified-change", "integer-overflow"]

[metadata]
difficulty = "easy"
category = "systems"
tags = ["ebpf", "integer-overflow", "model-checking", "kernel-tier"]

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 10240

[agent]
timeout_sec = 3600.0

[environment]
network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 10240
workdir = "/workspace"
